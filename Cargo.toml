[package]
name = "companion"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.1"
bevy_egui = { version = "0.43.1", default-features = false, features = [
    "default_fonts",
    "render",
] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
global-hotkey = "0.10.0"
redb = "5.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
winit = "0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSRunningApplication",
    "NSView",
    "NSWindow",
] }

[dev-dependencies]
tempfile = "3"
